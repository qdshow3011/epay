version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - epay-uploads:/var/www/html/assets/img/article
    environment:
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-epay}
      - DB_USER=${DB_USER:-epay}
      - DB_PASSWORD=${DB_PASSWORD:-epay123}
    depends_on:
      - db

  db:
    image: mysql:5.7
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${DB_NAME:-epay}
      MYSQL_USER: ${DB_USER:-epay}
      MYSQL_PASSWORD: ${DB_PASSWORD:-epay123}
    volumes:
      - epay-db-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --sql-mode=''
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - epay-redis-data:/data
    command: redis-server --appendonly yes

volumes:
  epay-db-data:
  epay-redis-data:
  epay-uploads:
